[project]
name = "apiverve-fillintheblanksgenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Fill in the Blanks Generator creates completion puzzles from idioms, proverbs, quotes, science facts, and geography trivia."
keywords = ["fill in the blank", "cloze test", "completion puzzle", "vocabulary quiz", "idioms"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/fillintheblanks?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/fillintheblanks?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/fillintheblanks-api"
Twitter = "https://twitter.com/apivervehq"
